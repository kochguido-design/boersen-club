<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Börsen-Club">
<meta name="theme-color" content="#0f766e">
<title>Börsen-Club</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📈%3C/text%3E%3C/svg%3E">
<style>
:root {
  --grund: #f4f7f6; --karte: #ffffff; --text: #1f2933; --leise: #66737f; --linie: #e3e8ec;
  --haupt: #0f766e; --haupt-hell: #ccfbf1; --plus: #15803d; --plus-hell: #dcfce7; --minus: #c2410c; --minus-hell: #ffedd5;
  --gold: #ca8a04; --gold-hell: #fef9c3; --blau: #2563eb; --blau-hell: #dbeafe; --schatten: 0 1px 3px rgba(15,23,42,.08), 0 4px 14px rgba(15,23,42,.05);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--grund); color: var(--text); font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--haupt); }
#app { max-width: 760px; margin: 0 auto; padding: 0 16px 96px; }
.kopf { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 10px; position: sticky; top: 0; background: var(--grund); z-index: 5; }
.logo { font-weight: 800; font-size: 19px; letter-spacing: -.2px; color: var(--haupt); text-decoration: none; }
.ich { border: 0; background: var(--karte); box-shadow: var(--schatten); border-radius: 999px; padding: 6px 12px 6px 8px; font-weight: 600; }
.demo-band { background: var(--gold-hell); color: #713f12; text-align: center; font-size: 13px; padding: 6px 10px; border-radius: 10px; margin-top: 10px; }
h1 { font-size: 24px; margin: 8px 0 12px; letter-spacing: -.3px; }
h2 { font-size: 18px; margin: 22px 0 10px; }
h3 { font-size: 16px; margin: 0 0 6px; }
.karte { background: var(--karte); border-radius: 18px; box-shadow: var(--schatten); padding: 16px; margin-bottom: 14px; }
.leise { color: var(--leise); font-size: 14px; }
.klein { font-size: 13px; }
.gross { font-size: 32px; font-weight: 800; letter-spacing: -.5px; }
.plus { color: var(--plus); } .minus { color: var(--minus); }
.pille { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 13px; font-weight: 700; }
.pille.plus { background: var(--plus-hell); } .pille.minus { background: var(--minus-hell); } .pille.null { background: var(--linie); color: var(--leise); }
.knopf { display: inline-block; border: 0; border-radius: 14px; padding: 12px 18px; font-weight: 700; background: var(--haupt); color: #fff; text-decoration: none; text-align: center; }
.knopf.zweit { background: var(--haupt-hell); color: var(--haupt); }
.knopf.rot { background: var(--minus); }
.knopf.breit { display: block; width: 100%; }
.knopf[disabled] { opacity: .45; cursor: default; }
.reihe { display: flex; align-items: center; gap: 12px; }
.reihe > .wachsen { flex: 1; min-width: 0; }
.raster2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.wert-kachel { background: var(--grund); border-radius: 12px; padding: 10px 12px; }
.wert-kachel b { display: block; font-size: 18px; }
.liste { list-style: none; margin: 0; padding: 0; }
.liste > li { border-top: 1px solid var(--linie); }
.liste > li:first-child { border-top: 0; }
.zeile { display: flex; align-items: center; gap: 12px; padding: 11px 2px; text-decoration: none; color: inherit; width: 100%; background: none; border: 0; text-align: left; }
.zeile .emoji { font-size: 26px; width: 34px; text-align: center; flex: none; }
.zeile .mitte { flex: 1; min-width: 0; }
.zeile .mitte b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zeile .rechts { text-align: right; white-space: nowrap; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.97); border-top: 1px solid var(--linie); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
.nav a { flex: 1; max-width: 150px; text-align: center; padding: 8px 2px 9px; font-size: 12px; color: var(--leise); text-decoration: none; font-weight: 600; }
.nav a span { display: block; font-size: 22px; line-height: 1.2; }
.nav a.an { color: var(--haupt); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip { border: 1px solid var(--linie); background: var(--karte); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; }
.chip.an { background: var(--haupt); color: #fff; border-color: var(--haupt); }
.eingabe { width: 100%; border: 1.5px solid var(--linie); border-radius: 12px; padding: 12px 14px; background: #fff; font-size: 17px; }
.eingabe:focus { outline: none; border-color: var(--haupt); }
.kinder { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.kind-kachel { border: 0; background: var(--karte); box-shadow: var(--schatten); border-radius: 18px; padding: 18px 10px; font-weight: 700; font-size: 17px; }
.kind-kachel span { display: block; font-size: 42px; }
.pinfeld { display: flex; justify-content: center; gap: 12px; margin: 18px 0; }
.pinfeld i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--haupt); display: block; }
.pinfeld i.voll { background: var(--haupt); }
.tasten { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 0 auto; }
.tasten button { border: 0; background: var(--karte); box-shadow: var(--schatten); border-radius: 16px; padding: 14px 0; font-size: 24px; font-weight: 700; }
.fehler { color: var(--minus); font-weight: 600; min-height: 1.4em; text-align: center; }
.fortschritt { height: 10px; background: var(--linie); border-radius: 99px; overflow: hidden; }
.fortschritt i { display: block; height: 100%; background: var(--haupt); border-radius: 99px; }
.modul-kopf { display: flex; align-items: center; gap: 8px; margin: 22px 0 8px; font-weight: 800; font-size: 17px; }
.lektion { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: var(--karte); box-shadow: var(--schatten); margin-bottom: 10px; text-decoration: none; color: inherit; }
.lektion .emoji { font-size: 28px; width: 40px; text-align: center; }
.lektion.zu { opacity: .5; }
.lektion.dran { outline: 2.5px solid var(--haupt); }
.stern { color: var(--gold); font-weight: 700; white-space: nowrap; }
.lernkarte { min-height: 300px; display: flex; flex-direction: column; }
.lernkarte .bild { font-size: 64px; text-align: center; margin: 4px 0 8px; }
.lernkarte .text p { margin: 0 0 10px; }
mark { background: var(--gold-hell); padding: 0 3px; border-radius: 4px; }
.profi { margin-top: 10px; background: var(--blau-hell); border-radius: 12px; padding: 10px 12px; font-size: 15px; }
.profi summary { font-weight: 700; color: var(--blau); cursor: pointer; }
.punkte { display: flex; justify-content: center; gap: 6px; margin: 4px 0 12px; }
.punkte i { width: 8px; height: 8px; border-radius: 50%; background: var(--linie); display: block; }
.punkte i.an { background: var(--haupt); }
.unten { display: flex; gap: 10px; margin-top: auto; padding-top: 14px; }
.unten .knopf { flex: 1; }
.antwort { display: block; width: 100%; text-align: left; border: 2px solid var(--linie); background: #fff; border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; font-weight: 600; }
.antwort.richtig { border-color: var(--plus); background: var(--plus-hell); }
.antwort.falsch { border-color: var(--minus); background: var(--minus-hell); }
.rueckmeldung { border-radius: 14px; padding: 12px 14px; margin: 6px 0 12px; }
.rueckmeldung.gut { background: var(--plus-hell); } .rueckmeldung.schlecht { background: var(--minus-hell); }
.zahlreihe { display: flex; gap: 10px; align-items: center; }
.zahlreihe .eingabe { flex: 1; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 46px; height: 46px; border-radius: 12px; border: 0; background: var(--haupt-hell); color: var(--haupt); font-size: 24px; font-weight: 800; }
.stepper input { width: 90px; text-align: center; }
.umschalter { display: flex; background: var(--grund); border-radius: 12px; padding: 4px; margin-bottom: 12px; }
.umschalter button { flex: 1; border: 0; background: none; padding: 9px; border-radius: 9px; font-weight: 700; color: var(--leise); }
.umschalter button.an { background: #fff; color: var(--text); box-shadow: var(--schatten); }
.rechnung { background: var(--grund); border-radius: 12px; padding: 10px 12px; margin: 12px 0; font-size: 15px; }
.rechnung div { display: flex; justify-content: space-between; gap: 10px; }
.rechnung .summe { border-top: 1px solid var(--linie); margin-top: 6px; padding-top: 6px; font-weight: 800; }
.schloss { background: var(--gold-hell); border-radius: 14px; padding: 12px 14px; }
.diagramm svg { display: block; width: 100%; height: auto; }
.legende { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; margin-top: 6px; }
.legende i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.rang { font-size: 22px; width: 34px; text-align: center; flex: none; font-weight: 800; color: var(--leise); }
.mini-pos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.mini-pos span { background: var(--grund); border-radius: 8px; padding: 2px 8px; font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: 86px; transform: translateX(-50%); background: #1f2933; color: #fff; padding: 11px 16px; border-radius: 14px; font-weight: 600; z-index: 30; max-width: 92%; text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.schleier { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.dialog { background: #fff; width: 100%; max-width: 520px; border-radius: 22px 22px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); }
@media (min-width: 600px) { .schleier { align-items: center; } .dialog { border-radius: 22px; } }
.laden { text-align: center; padding: 60px 0; color: var(--leise); }
.tabelle { width: 100%; border-collapse: collapse; font-size: 14px; }
.tabelle td, .tabelle th { padding: 7px 4px; border-top: 1px solid var(--linie); text-align: right; }
.tabelle th { color: var(--leise); font-weight: 600; font-size: 12px; border-top: 0; }
.tabelle td:first-child, .tabelle th:first-child { text-align: left; }
.zeitraum { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
.zeitraum button { border: 0; background: var(--grund); border-radius: 8px; padding: 5px 10px; font-size: 13px; font-weight: 700; color: var(--leise); }
.zeitraum button.an { background: var(--haupt); color: #fff; }
.feier { font-size: 54px; text-align: center; }
</style>
</head>
<body>
<div id="app"><div class="laden">Lädt …</div></div>
<script src="einstellungen.js"></script>
<script src="inhalt.js"></script>
<script>
  window.BC_DEMO = !window.BC_API || /[?&]demo/.test(location.search);
  if (window.BC_DEMO) document.write('<script src="skript/demo.js"><\/script><script src="skript/Code.js"><\/script>');
</script>
<script>
(function () {
  "use strict";
  var BC = window.BC || { module: [], lektionen: [], firmen: {} };
  var FARBEN = ["#f97316", "#2563eb", "#16a34a", "#db2777", "#7c3aed", "#0891b2", "#ca8a04", "#dc2626"];
  var app = document.getElementById("app");

  // ---------- Speicher ----------
  function lies(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function schreib(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { } }
  var S = {
    passwort: lies("bc-passwort"), kind: lies("bc-kind"), pin: lies("bc-pin"),
    stand: null, kinderAuswahl: null, pinEingabe: "", pinKind: null, pinMerken: true, fehler: "",
    marktFilter: "Alle", suche: "", handelArt: "kauf", handelStueck: 1, zeitraum: "1mo", verlauf: {}, lektion: null, offen: {}
  };
  if (window.BC_DEMO && window.BC_DEMO_EINRICHTEN) window.BC_DEMO_EINRICHTEN();

  // ---------- Hilfen ----------
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function md(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/__(.+?)__/g, "<u>$1</u>").replace(/\[\[(.+?)\]\]/g, "<mark>$1</mark>")
      .split(/\n+/).map(function (p) { return "<p>" + p + "</p>"; }).join("");
  }
  function zahl(x, stellen) { return Number(x).toLocaleString("de-DE", { minimumFractionDigits: stellen, maximumFractionDigits: stellen }); }
  function euro(x) { return x == null || isNaN(x) ? "–" : zahl(x, 2) + " €"; }
  function vorz(x) { return x > 0 ? "+" : x < 0 ? "−" : "±"; }
  function euroPlus(x) { return vorz(x) + zahl(Math.abs(x), 2) + " €"; }
  function prozent(x) { return vorz(x) + zahl(Math.abs(x), 1) + " %"; }
  function klasse(x) { return x > 0.0001 ? "plus" : x < -0.0001 ? "minus" : "null"; }
  function datum(s) { if (!s) return ""; var t = s.slice(0, 10).split("-"); return t[2] + "." + t[1] + "." + (s.length > 10 ? " " + s.slice(11, 16) + " Uhr" : t[0]); }
  function kurzDatum(s) { var t = s.slice(0, 10).split("-"); return Number(t[2]) + "." + Number(t[1]) + "."; }
  function mischen(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function toast(text, ms) {
    var alt = document.querySelector(".toast"); if (alt) alt.parentNode.removeChild(alt);
    var t = document.createElement("div"); t.className = "toast"; t.textContent = text; document.body.appendChild(t);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, ms || 3200);
  }
  function geh(hash) { if (location.hash === hash) zeichne(); else location.hash = hash; }

  // ---------- Server ----------
  function api(aktion, extra) {
    var body = { aktion: aktion, passwort: S.passwort };
    if (extra) for (var k in extra) body[k] = extra[k];
    if (window.BC_DEMO) {
      return new Promise(function (ok) { setTimeout(function () { ok(JSON.parse(window.doPost({ postData: { contents: JSON.stringify(body) } }).getContent())); }, 150); });
    }
    return fetch(window.BC_API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }
  function mitPin(aktion, extra) {
    extra = extra || {}; extra.kind = S.kind; extra.pin = S.pin;
    return api(aktion, extra).then(function (r) {
      if (!r.ok && r.pin) { S.pin = null; schreib("bc-pin", null); toast("Bitte gib deine PIN nochmal ein."); S.pinKind = S.kind; S.pinEingabe = ""; geh("#/pin"); }
      return r;
    });
  }
  var laedt = false;
  function standLaden(stumm) {
    if (laedt || !S.passwort) return Promise.resolve();
    laedt = true;
    return api("stand").then(function (r) {
      laedt = false;
      if (r.ok) { S.stand = r; S.ladeFehler = ""; return; }
      if (r.fehler === "passwort") { abmelden(true); return; }
      S.ladeFehler = r.text || (r.fehler && r.fehler.length > 12 ? r.fehler : "Fehler beim Laden");
      if (!stumm) toast(S.ladeFehler);
    }, function () { laedt = false; S.ladeFehler = "Keine Verbindung zum Club-Server. Bist du online?"; if (!stumm) toast(S.ladeFehler); });
  }
  function abmelden(passwortAuch) {
    S.kind = null; S.pin = null; schreib("bc-kind", null); schreib("bc-pin", null);
    if (passwortAuch) { S.passwort = null; schreib("bc-passwort", null); S.stand = null; }
    geh("#/");
  }

  // ---------- Daten ----------
  function depots() { return S.stand ? S.stand.depots : []; }
  function farbe(d) { if (d.farbe) return d.farbe; var i = depots().indexOf(d); return FARBEN[(i < 0 ? 0 : i) % FARBEN.length]; }
  function meinDepot() { var m = null; depots().forEach(function (d) { if (d.name === S.kind) m = d; }); return m; }
  function aktie(id) { var a = null; (S.stand ? S.stand.aktien : []).forEach(function (x) { if (x.id === id) a = x; }); return a; }
  function tagPlus(a) { return a && a.kurs && a.vortag ? (a.kurs / a.vortag - 1) * 100 : 0; }
  function rangliste() { return depots().slice().sort(function (a, b) { return b.wert - a.wert; }); }
  function lektionErledigt(d, l) { var e = d && d.lektionen[l.id]; return !!e && (!l.abschluss || e.sterne >= (l.bestehen || 0)); }
  function lektionOffen(d, l) {
    var i = BC.lektionen.indexOf(l);
    return i === 0 || lektionErledigt(d, BC.lektionen[i - 1]);
  }
  function naechsteLektion(d) { for (var i = 0; i < BC.lektionen.length; i++) if (!lektionErledigt(d, BC.lektionen[i])) return BC.lektionen[i]; return null; }
  function lektionNamen(id) { var t = id; BC.lektionen.forEach(function (l) { if (l.id === id) t = l.titel; }); return t; }
  function besitzer(id) {
    var r = [];
    depots().forEach(function (d) { d.positionen.forEach(function (p) { if (p.id === id) r.push({ d: d, p: p }); }); });
    return r;
  }
  function boersenStatus() {
    var j = new Date(), tag = j.getDay(), min = j.getHours() * 60 + j.getMinutes();
    var werktag = tag >= 1 && tag <= 5;
    return { de: werktag && min >= 9 * 60 && min < 17 * 60 + 30, us: werktag && min >= 15 * 60 + 30 && min < 22 * 60 };
  }

  // ---------- Diagramm ----------
  function diagramm(serien, opt) {
    opt = opt || {};
    var B = Math.max(280, Math.min(700, (app.clientWidth || 380) - 64)), H = opt.hoehe || 170, L = 46, R = 8, O = 10, U = 22;
    var alle = [];
    serien.forEach(function (s) { s.punkte.forEach(function (p) { alle.push(p); }); });
    if (alle.length < 2) return '<p class="leise">Noch zu wenig Daten für eine Kurve.</p>';
    var xs = alle.map(function (p) { return p[0]; }), ys = alle.map(function (p) { return p[1]; });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    if (opt.linie != null) { y0 = Math.min(y0, opt.linie); y1 = Math.max(y1, opt.linie); }
    if (y1 - y0 < 1e-9) { y0 -= 1; y1 += 1; }
    var pad = (y1 - y0) * 0.08; y0 -= pad; y1 += pad;
    if (x1 === x0) x1 = x0 + 1;
    function X(v) { return L + (v - x0) / (x1 - x0) * (B - L - R); }
    function Y(v) { return O + (1 - (v - y0) / (y1 - y0)) * (H - O - U); }
    var svg = '<svg viewBox="0 0 ' + B + ' ' + H + '" role="img">';
    [y0 + pad, (y0 + y1) / 2, y1 - pad].forEach(function (v) {
      svg += '<line x1="' + L + '" x2="' + (B - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="#e3e8ec" stroke-width="1"/>';
      svg += '<text x="' + (L - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="10" fill="#66737f">' + esc(zahl(v, v >= 1000 ? 0 : 2)) + '</text>';
    });
    if (opt.linie != null) svg += '<line x1="' + L + '" x2="' + (B - R) + '" y1="' + Y(opt.linie) + '" y2="' + Y(opt.linie) + '" stroke="#94a3b8" stroke-dasharray="4 4" stroke-width="1"/>';
    serien.forEach(function (s) {
      if (!s.punkte.length) return;
      var d = s.punkte.map(function (p, i) { return (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1); }).join(" ");
      svg += '<path d="' + d + '" fill="none" stroke="' + s.farbe + '" stroke-width="' + (s.dick ? 3 : 2.2) + '" stroke-linejoin="round" stroke-linecap="round"/>';
      var letzt = s.punkte[s.punkte.length - 1];
      svg += '<circle cx="' + X(letzt[0]) + '" cy="' + Y(letzt[1]) + '" r="3.5" fill="' + s.farbe + '"/>';
    });
    var fmt = opt.xText || function (v) { var d = new Date(v * 1000); return d.getDate() + "." + (d.getMonth() + 1) + "."; };
    svg += '<text x="' + L + '" y="' + (H - 6) + '" font-size="10" fill="#66737f">' + esc(fmt(x0)) + '</text>';
    svg += '<text x="' + (B - R) + '" y="' + (H - 6) + '" text-anchor="end" font-size="10" fill="#66737f">' + esc(fmt(x1)) + '</text>';
    svg += "</svg>";
    var leg = serien.length > 1 ? '<div class="legende">' + serien.map(function (s) { return '<span><i style="background:' + s.farbe + '"></i>' + esc(s.name) + "</span>"; }).join("") + "</div>" : "";
    return '<div class="diagramm">' + svg + leg + "</div>";
  }
  function tagZahl(tag) { var t = tag.split("-"); return Date.UTC(+t[0], t[1] - 1, +t[2]) / 1000; }
  function clubSerien(nur) {
    var heute = S.stand.zeit.slice(0, 10);
    return depots().filter(function (d) { return !nur || d.name === nur; }).map(function (d) {
      var p = [];
